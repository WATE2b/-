<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0e0e0e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaeaea;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }
  #app {
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
    padding: 16px;
    width: 100%; max-width: 540px;
    height: 100%; max-height: 100vh;
    justify-content: center;
  }

  /* ---------- HUD ---------- */
  header {
    display: flex; gap: 28px;
    justify-content: center;
    width: 100%;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
  }
  .stat .lbl {
    font-size: 10px; letter-spacing: 2.5px;
    color: #5a5a5a;
    text-transform: uppercase;
  }
  .stat .val {
    font-size: 20px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #eaeaea;
    line-height: 1;
  }
  .stat .val.dim { color: #8a8a8a; font-weight: 500; }

  /* ---------- 画布 ---------- */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: min(480px, calc(100vh - 240px));
    border-radius: 4px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 0 1px #1e1e1e;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }

  /* ---------- 遮罩 ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center;
    background: rgba(0, 0, 0, .88);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 {
    margin: 0;
    font-size: 22px; font-weight: 500;
    letter-spacing: 6px;
    color: #eaeaea;
  }
  .overlay p {
    margin: 0; font-size: 13px; line-height: 1.8;
    color: #7a7a7a; letter-spacing: .5px;
  }
  .overlay .big {
    font-size: 52px; font-weight: 300;
    color: #fff; letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin: 4px 0;
  }
  .overlay button {
    margin-top: 12px;
    padding: 12px 40px;
    font-size: 13px; font-weight: 500; letter-spacing: 4px;
    font-family: inherit;
    color: #0e0e0e;
    background: #eaeaea;
    border: none; border-radius: 3px;
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .overlay button:hover { opacity: .88; }
  .overlay button:active { transform: scale(.96); }

  /* ---------- 虚拟方向键 ---------- */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
    gap: 6px;
    margin-top: 4px;
  }
  .dpad button {
    font-size: 15px;
    color: #8a8a8a;
    background: transparent;
    border: 1px solid #262626;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: background .12s, color .12s;
  }
  .dpad button:active {
    background: #1a1a1a;
    color: #eaeaea;
  }
  .dpad .up    { grid-area: 1 / 2; }
  .dpad .left  { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down  { grid-area: 3 / 2; }

  @media (pointer: coarse) {
    .dpad { display: grid; }
    #app { gap: 10px; }
  }

  .hint {
    font-size: 11px; letter-spacing: 1.5px;
    color: #3a3a3a;
    text-align: center;
  }
  @media (pointer: coarse) { .hint { display: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><span class="lbl">Score</span><span class="val" id="score">0</span></div>
    <div class="stat"><span class="lbl">Best</span><span class="val dim" id="best">0</span></div>
    <div class="stat"><span class="lbl">Length</span><span class="val dim" id="len">3</span></div>
  </header>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="dpad">
    <button class="up"    data-dir="up">▲</button>
    <button class="left"  data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down"  data-dir="down">▼</button>
  </div>

  <div class="hint">方向键 / WASD &nbsp;·&nbsp; 空格暂停</div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础设置
  ============================================================ */
  const COLS = 20, ROWS = 20, CELL = 26;
  const W = COLS * CELL, H = ROWS * CELL;

  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const ov = document.getElementById('ov');
  const $score = document.getElementById('score');
  const $best  = document.getElementById('best');
  const $len   = document.getElementById('len');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * dpr;
  canvas.height = H * dpr;

  const COLORS = {
    bg:    '#000000',
    grid:  '#141414',
    snake: '#eaeaea',
    head:  '#ffffff',
    food:  '#eaeaea'
  };

  /* ============================================================
     常量与工具
  ============================================================ */
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  /* ============================================================
     游戏状态
  ============================================================ */
  let snake, prevSnake, dir, queue;
  let food;
  let score, alive, paused, running;
  let stepTimer, progress;
  let gameTime, lastT;

  let best = 0;
  try { best = parseInt(localStorage.getItem('snake_min_best') || '0', 10) || 0; } catch (e) { best = 0; }

  /* ============================================================
     初始化 / 重置
  ============================================================ */
  function reset() {
    snake = [ { x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 } ];
    prevSnake = snake.map(function (c) { return { x: c.x, y: c.y }; });
    dir = DIRS.right;
    queue = [];

    score = 0;
    alive = true;
    paused = false;

    stepTimer = 0;
    progress = 0;
    gameTime = 0;
    lastT = 0;

    food = null;
    spawnFood();
    updateHUD();
  }

  function updateHUD() {
    $score.textContent = score;
    $best.textContent  = best;
    $len.textContent   = snake ? snake.length : 0;
  }

  /* ============================================================
     速度：随分数提升，最高约 70ms/格
  ============================================================ */
  function currentInterval() {
    const lvl = Math.min(14, Math.floor(score / 60));
    return 150 - lvl * 6;
  }

  /* ============================================================
     食物
  ============================================================ */
  function freeCells() {
    const used = {};
    snake.forEach(function (s) { used[s.x + ',' + s.y] = 1; });
    if (food) used[food.x + ',' + food.y] = 1;

    const list = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!used[x + ',' + y]) list.push({ x: x, y: y });
      }
    }
    return list;
  }

  function spawnFood() {
    const list = freeCells();
    if (!list.length) { food = null; return; }
    food = list[(Math.random() * list.length) | 0];
  }

  /* ============================================================
     单步逻辑
  ============================================================ */
  function step() {
    prevSnake = snake.map(function (c) { return { x: c.x, y: c.y }; });

    /* --- 处理输入队列 --- */
    while (queue.length) {
      const d = queue.shift();
      if (d.x === -dir.x && d.y === -dir.y) continue;
      if (d.x ===  dir.x && d.y ===  dir.y) continue;
      dir = d;
      break;
    }

    /* --- 新蛇头位置（无限穿墙） --- */
    let nx = snake[0].x + dir.x;
    let ny = snake[0].y + dir.y;
    nx = (nx + COLS) % COLS;
    ny = (ny + ROWS) % ROWS;

    /* --- 撞到自己（尾巴不算） --- */
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        die();
        return;
      }
    }

    /* --- 吃食物 --- */
    let ate = false;
    if (food && nx === food.x && ny === food.y) {
      ate = true;
      score += 10;
      if (score > best) best = score;
      food = null;
      spawnFood();
    }

    snake.unshift({ x: nx, y: ny });
    if (!ate) snake.pop();

    updateHUD();
  }

  /* ============================================================
     死亡
  ============================================================ */
  function die() {
    alive = false;
    running = false;

    if (score > best) best = score;
    try { localStorage.setItem('snake_min_best', String(best)); } catch (e) {}
    updateHUD();

    showOverlay(
      '<h2>GAME OVER</h2>' +
      '<div class="big">' + score + '</div>' +
      '<p>BEST &nbsp; ' + best + ' &nbsp;·&nbsp; LENGTH &nbsp;' + snake.length + '</p>' +
      '<button data-action="restart">RESTART</button>'
    );
  }

  /* ============================================================
     输入
  ============================================================ */
  function setDir(name) {
    if (!running || !alive || paused) return;
    const d = DIRS[name];
    if (!d) return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return;
    if (d.x ===  last.x && d.y ===  last.y) return;
    if (queue.length < 3) queue.push(d);
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', function (e) {
    const k = e.key;
    if (KEYMAP[k]) {
      e.preventDefault();
      setDir(KEYMAP[k]);
      return;
    }
    if (k === ' ' || k === 'Enter' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (!running || !alive) startGame();
      else togglePause();
    }
  }, { passive: false });

  ov.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (btn) {
      const a = btn.dataset.action;
      if (a === 'start' || a === 'restart') startGame();
      else if (a === 'resume') togglePause();
      return;
    }
    if (!running || !alive) startGame();
    else if (paused) togglePause();
  });

  /* 虚拟方向键 */
  document.querySelectorAll('.dpad button').forEach(function (b) {
    const fire = function (ev) {
      ev.preventDefault();
      setDir(b.dataset.dir);
    };
    b.addEventListener('touchstart', fire, { passive: false });
    b.addEventListener('mousedown', fire);
  });

  /* 滑动手势 */
  let touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) { e.preventDefault(); return; }
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else                             setDir(dy > 0 ? 'down'  : 'up');
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', function () { touchStart = null; });

  /* ============================================================
     流程控制
  ============================================================ */
  function startGame() {
    reset();
    running = true;
    paused = false;
    hideOverlay();
  }

  function togglePause() {
    if (!running || !alive) return;
    paused = !paused;
    if (paused) {
      showOverlay(
        '<h2>PAUSED</h2>' +
        '<p>SCORE &nbsp; ' + score + '</p>' +
        '<button data-action="resume">RESUME</button>'
      );
    } else {
      hideOverlay();
    }
  }

  function showOverlay(html) {
    ov.innerHTML = html;
    ov.classList.add('show');
  }
  function hideOverlay() {
    ov.classList.remove('show');
  }

  /* ============================================================
     渲染
  ============================================================ */
  function drawBackground() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, H);
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(W, y * CELL + 0.5);
    }
    ctx.stroke();
  }

  function interp(a, b, t) {
    if (!a) return b;
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) return b; // 穿墙瞬移，不插值
    return { x: a.x + dx * t, y: a.y + dy * t };
  }

  function drawSnake() {
    const t = progress;
    const n = snake.length;

    for (let i = n - 1; i >= 0; i--) {
      const to   = snake[i];
      const from = prevSnake[i] || to;
      const p    = interp(from, to, t);
      const cx   = (p.x + 0.5) * CELL;
      const cy   = (p.y + 0.5) * CELL;

      const inset = i === 0 ? 2 : 3.5;
      const size  = CELL - inset * 2;

      ctx.fillStyle = i === 0 ? COLORS.head : COLORS.snake;
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0.35, 1 - i / n * 0.55);
      ctx.fillRect(cx - size / 2, cy - size / 2, size, size);
      ctx.globalAlpha = 1;
    }
  }

  function drawFood() {
    if (!food) return;
    const cx = (food.x + 0.5) * CELL;
    const cy = (food.y + 0.5) * CELL;
    const r = CELL * 0.24;

    ctx.fillStyle = COLORS.food;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawFood();
    if (snake) drawSnake();
  }

  /* ============================================================
     主循环
  ============================================================ */
  function loop(ts) {
    requestAnimationFrame(loop);

    if (!lastT) lastT = ts;
    let dt = ts - lastT;
    lastT = ts;
    if (dt > 120) dt = 120;
    if (dt < 0) dt = 0;

    gameTime += dt;

    if (running && alive && !paused) {
      stepTimer += dt;
      let guard = 0;
      while (alive && stepTimer >= currentInterval() && guard++ < 6) {
        const iv = currentInterval();
        stepTimer -= iv;
        step();
      }
      if (!alive) stepTimer = 0;
      progress = alive ? Math.min(1, stepTimer / currentInterval()) : 1;
    } else if (!alive) {
      progress = 1;
    }

    render();
  }

  /* ============================================================
     启动
  ============================================================ */
  reset();
  running = false;
  alive = true;
  updateHUD();

  showOverlay(
    '<h2>SNAKE</h2>' +
    '<p>方向键 / WASD 控制</p>' +
    '<p>撞墙穿墙 · 撞到自己结束</p>' +
    '<button data-action="start">START</button>'
  );

  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
